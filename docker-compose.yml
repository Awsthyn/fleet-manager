# Local PostgreSQL for development and tests. Matches the major version used on Neon.
#   docker compose up -d db
# The test suite creates and uses its own database (fleet_test) on this server.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      # 5433 on the host to avoid clashing with a locally installed PostgreSQL.
      - "127.0.0.1:5433:5432"
    volumes:
      # postgres:18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - fleet-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  fleet-pgdata:
