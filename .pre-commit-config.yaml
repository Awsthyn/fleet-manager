# Install once per clone:  uv run pre-commit install
# Run on everything:       uv run pre-commit run --all-files
#
# Local hooks call the Ruff pinned in uv.lock, so commits, CI and editors use one Ruff version.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (with autofix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
