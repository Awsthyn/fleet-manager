name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.total }}
    env:
      ENV: test
      TEST_DATABASE_URL: postgresql://fleet:fleet@127.0.0.1:5432/fleet_test
    services:
      # Same major version as Neon; integration tests run migrations and queries against it.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest with coverage (fails under 80 %)
        run: >-
          uv run pytest --cov --cov-report=term --cov-report=xml --cov-report=html
          --cov-fail-under=80

      - name: Coverage summary
        id: coverage
        if: always()
        run: |
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          echo "total=$(uv run coverage report --format=total)" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  coverage-badge:
    # Publishes the coverage figure for the README badge (rendered by shields.io, no paid service).
    name: Publish coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write badge JSON to the badges branch
        env:
          COVERAGE: ${{ needs.backend.outputs.coverage }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if   [ "$COVERAGE" -ge 90 ]; then color=brightgreen
          elif [ "$COVERAGE" -ge 80 ]; then color=green
          elif [ "$COVERAGE" -ge 70 ]; then color=yellow
          else color=red; fi
          mkdir badges && cd badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$COVERAGE" "$color" > coverage.json
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Update coverage badge: ${COVERAGE}%"
          # A single-commit branch, force-pushed: it never accumulates history.
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
