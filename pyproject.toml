[project]
name = "fleet-manager"
dynamic = ["version"]
description = "Fleet management REST API built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff ---------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific rules
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "PT",    # flake8-pytest-style
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # assert is how pytest works
    "S105", # fake secrets in fixtures are intentional
    "S106",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

# --- Pyright ------------------------------------------------------------

[tool.pyright]
include = ["app", "tests", "migrations"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# --- Coverage -----------------------------------------------------------

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's asyncio layer runs code inside greenlets; without this, coverage loses track of
# code that resumes after a database call and under-reports services and repositories.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ['if __name__ == "__main__":', "if TYPE_CHECKING:"]

# --- Pytest -------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]
